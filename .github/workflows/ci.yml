name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler 4 (and miniflare) require Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is in sync with package.json, so use the
      # reproducible install.
      - run: npm ci

      # A gate: a failing unit test blocks the merge (and deploy.yml's gates job runs the same).
      - run: npm test

      # Type-checks .astro frontmatter and .ts alike. NOT a gate yet: the
      # codebase has ~98 older type errors (implicit `any`s, Cloudflare Request
      # typings, etc.) that predate CI. The step still runs and shows them in
      # the log, but doesn't fail the build. Once the count reaches 0, delete
      # the `continue-on-error` line to make it a gate.
      - run: npm run check
        continue-on-error: true

      # The real gate: the site must build.
      - run: npm run build

      # Advisory only, by team choice: lint is warnings-only and formatting is
      # reported but never blocks a merge. Only the build above is a gate.
      - run: npm run lint
        continue-on-error: true

      - run: npm run format:check
        continue-on-error: true
