name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler 4 (and miniflare) require Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is in sync with package.json, so use the
      # reproducible install.
      - run: npm ci

      # A gate: a failing unit test blocks the merge (and deploy.yml's gates job runs the same).
      - run: npm test

      # A gate: any type error in .astro frontmatter or .ts blocks the merge.
      - run: npm run check

      # The real gate: the site must build.
      - run: npm run build

      # A gate: the Worker entry (src/worker/entry.ts) type-checks against the build it wraps. It runs here,
      # after the build, because dist/ does not exist before it.
      - run: npx tsc -p tsconfig.worker.json --noEmit

      # Advisory only, by team choice: lint is warnings-only and formatting is
      # reported but never blocks a merge. The tests, type check and build above are the gates.
      - run: npm run lint
        continue-on-error: true

      - run: npm run format:check
        continue-on-error: true
